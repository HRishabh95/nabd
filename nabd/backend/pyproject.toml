[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nabd"
version = "0.1.0"
description = "Nabd: forecasting, fraud-network and reserve-investment intelligence for the Central Bank of the UAE (POC)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "yfinance>=1.8.0",
  "pandas>=3.1.1",
  "pyarrow>=26.0.1",
  "duckdb>=2.0.0",
  "scikit-learn>=1.9.1",
  "scipy>=1.18.1",
  "hmmlearn>=0.3.3",
  "pypdf>=7.1.0",
  "statsmodels>=0.15.0",
  "networkx>=3.7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
nabd = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC"]
